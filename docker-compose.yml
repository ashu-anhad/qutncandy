version: "3.9"

services:
  db:
    image: postgres:16
    container_name: qutncandy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qutncandy}
      POSTGRES_USER: ${POSTGRES_USER:-qutn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qutn_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qutncandy-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qutncandy-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
